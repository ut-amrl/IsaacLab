robot_cfg:
  kinematics:
    base_link: gen3_base_link
    ee_link: gen3_end_effector_link
    # Same URDF as Isaac --urdf (gen3_2f85.urdf). Mesh paths use ../arms/... relative to this file;
    # asset_root_path must be the URDF directory so cuRobo mesh joins resolve like Isaac.
    urdf_path: /workspace/ros2_kortex/kortex_description/robots/gen3_2f85.urdf
    asset_root_path: /workspace/ros2_kortex/kortex_description/robots
    mesh_link_names: &id001
    - gen3_base_link
    - gen3_shoulder_link
    - gen3_half_arm_1_link
    - gen3_half_arm_2_link
    - gen3_forearm_link
    - gen3_spherical_wrist_1_link
    - gen3_spherical_wrist_2_link
    - gen3_bracelet_link
    collision_link_names: *id001
    collision_sphere_buffer: 0.005
    collision_spheres:
      gen3_base_link:
      - center:
        - 0.0
        - 0.0
        - 0.1
        radius: 0.05
      gen3_shoulder_link:
      - center:
        - 0.0
        - 0.0
        - -0.1
        radius: 0.06
      - center:
        - 0.0
        - 0.0
        - -0.15
        radius: 0.05
      gen3_half_arm_1_link:
      - center:
        - 0.0
        - -0.0
        - 0.0
        radius: 0.055
      - center:
        - 0.0
        - -0.07
        - 0.0
        radius: 0.055
      - center:
        - 0.0
        - -0.15
        - 0.0
        radius: 0.055
      gen3_half_arm_2_link:
      - center:
        - 0.0
        - -0.0
        - 0.0
        radius: 0.055
      - center:
        - 0.0
        - -0.0
        - -0.07
        radius: 0.055
      - center:
        - 0.0
        - -0.0
        - -0.15
        radius: 0.055
      - center:
        - 0.0
        - -0.0
        - -0.21
        radius: 0.055
      gen3_forearm_link:
      - center:
        - 0.0
