    self_collision_buffer:
      gen3_base_link: 0.0
      gen3_shoulder_link: 0.0
      gen3_half_arm_1_link: 0.0
      gen3_half_arm_2_link: 0.0
      gen3_forearm_link: 0.0
      gen3_spherical_wrist_1_link: 0.0
      gen3_spherical_wrist_2_link: 0.0
      gen3_bracelet_link: 0.0
    self_collision_ignore:
      gen3_base_link:
      - gen3_shoulder_link
      gen3_shoulder_link:
      - gen3_half_arm_1_link
      gen3_half_arm_1_link:
      - gen3_half_arm_2_link
      gen3_half_arm_2_link:
