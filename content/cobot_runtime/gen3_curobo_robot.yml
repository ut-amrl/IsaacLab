      - center:
        - 0.0
        - -0.0
        - -0.085
        radius: 0.055
      gen3_spherical_wrist_2_link:
      - center:
        - 0.0
        - -0.0
        - 0.0
        radius: 0.05
      - center:
        - 0.0
        - -0.085
        - -0.0
        radius: 0.05
      gen3_bracelet_link:
